    // ==========================================
    // PAGE 3: WEB-TO-PRINT ENGINE
    // ==========================================
    function PrintEngineView({ prints, setPrints, showToast }) {
      // Configuration State
      const [files, setFiles] = useState([
        { name: 'Document_Scan_2026.pdf', size: '2.4 MB', pages: 8 }
      ]);
      const [colorMode, setColorMode] = useState('B&W'); // B&W or Color
      const [paperSize, setPaperSize] = useState('A4');
      const [duplex, setDuplex] = useState('Duplex'); // Single or Duplex
      const [copies, setCopies] = useState(1);
      const [binding, setBinding] = useState('None');
      const [confirmedOrder, setConfirmedOrder] = useState(null);

      const qrRef = useRef(null);

      // Total Pages Calculation
      const totalPages = files.reduce((acc, f) => acc + f.pages, 0);

      // Pricing Logic
      const pricePerPage = colorMode === 'Color' ? 0.35 : 0.08;
      const subtotal = totalPages * pricePerPage * copies;
      const bindingFee = binding === 'Stapling' ? 0.50 : binding === 'Spiral Binding' ? 2.50 : 0;
      
      // Bulk discount (10% off for >20 pages)
      const hasBulkDiscount = totalPages * copies >= 20;
      const finalPrice = (hasBulkDiscount ? subtotal * 0.9 : subtotal) + bindingFee;

      // Handle Mock File Drop
      const handleAddFile = (e) => {
        const fileList = e.target.files;
        if (fileList && fileList[0]) {
          const newF = {
            name: fileList[0].name,
            size: (fileList[0].size / (1024 * 1024)).toFixed(1) + ' MB',
            pages: Math.floor(Math.random() * 12) + 1
          };
          setFiles([...files, newF]);
          showToast(`Attached ${newF.name}`);
        }
      };

      // Generate Print Order & Pickup Code
      const handleGenerateOrder = () => {
        if (files.length === 0) {
          showToast('Please attach at least one document to print', 'error');
          return;
        }

        const pickupCode = Math.floor(1000 + Math.random() * 9000).toString();
        const printId = 'PRN-' + Math.floor(1000 + Math.random() * 9000);

        const newPrint = {
          id: printId,
          name: 'Online Guest',
          pages: totalPages,
          copies: copies,
          color: colorMode,
          layout: duplex,
          size: paperSize,
          total: `$${finalPrice.toFixed(2)}`,
          code: pickupCode,
          status: 'Queued',
          time: 'Just now',
          files: files.map(f => f.name)
        };

        setPrints([newPrint, ...prints]);
        setConfirmedOrder(newPrint);
        showToast('Print order generated! Present code at store counter.');
      };

      // Render QR Code after DOM updates
      useEffect(() => {
        if (confirmedOrder && qrRef.current && window.QRCode) {
          qrRef.current.innerHTML = '';
          new window.QRCode(qrRef.current, {
            text: `PRINT_CODE:${confirmedOrder.code}`,
            width: 120,
            height: 120,
            colorDark: "#1D1D1F",
            colorLight: "#FFFFFF",
            correctLevel: window.QRCode.CorrectLevel.H
          });
        }
      }, [confirmedOrder]);

      return (
        <div className="space-y-10">
          <div className="max-w-2xl">
            <h1 className="text-3xl font-semibold text-charcoal">Web-to-Print Express Hub</h1>
            <p className="text-charcoal-muted text-sm mt-1">Upload your documents now, customize print options, and scan your pickup QR code at our store terminal.</p>
          </div>

          {!confirmedOrder ? (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
              
              {/* Left Column: File Upload & Customizer (2 Cols) */}
              <div className="lg:col-span-2 space-y-6">
                
                {/* File Upload Zone */}
                <div className="bg-card rounded-3xl p-6 sm:p-8 border border-cream-200/80 shadow-apple space-y-4">
                  <h2 className="text-base font-semibold text-charcoal">1. Upload Documents</h2>
                  
                  {/* Drop area */}
                  <label className="border-2 border-dashed border-cream-300 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer hover:border-terracotta hover:bg-cream-50/50 transition text-center group">
                    <input type="file" className="hidden" onChange={handleAddFile} accept=".pdf,.doc,.docx,.png,.jpg" />
                    <div className="w-12 h-12 rounded-full bg-cream-100 text-charcoal group-hover:bg-terracotta group-hover:text-white flex items-center justify-center mb-3 transition">
                      <i data-lucide="upload-cloud" className="w-6 h-6"></i>
                    </div>
                    <p className="text-sm font-semibold text-charcoal">Click or drag & drop files here</p>
                    <p className="text-xs text-charcoal-light mt-1">PDF, Word, or Images (Max 50MB per file)</p>
                    <span className="mt-3 text-[11px] bg-cream-100 text-charcoal px-3 py-1 rounded-full border border-cream-200 font-medium">
                      Mobile Camera Scan Allowed
                    </span>
                  </label>

                  {/* Attached Files List */}
                  <div className="space-y-2 pt-2">
                    {files.map((file, idx) => (
                      <div key={idx} className="flex items-center justify-between p-3 bg-cream-50 rounded-xl border border-cream-200 text-xs">
                        <div className="flex items-center space-x-3 truncate">
                          <i data-lucide="file-text" className="w-4 h-4 text-terracotta flex-shrink-0"></i>
                          <span className="font-medium text-charcoal truncate">{file.name}</span>
                          <span className="text-charcoal-light">({file.size})</span>

                        <div className="flex items-center space-x-3">
                          <span className="text-[11px] bg-cream-200 text-charcoal font-semibold px-2 py-0.5 rounded">
                            {file.pages} {file.pages === 1 ? 'page' : 'pages'}

                          <button 
                            onClick={() => setFiles(files.filter((_, i) => i !== idx))}

                          >
                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Print Customizer Card */}
                <div className="bg-card rounded-3xl p-6 sm:p-8 border border-cream-200/80 shadow-apple space-y-6">
                  <h2 className="text-base font-semibold text-charcoal">2. Print Customization</h2>

                      </div>

                      >
                        <option value="None">None (Loose Sheets)</option>

    function CatalogView({ accessories, setHolds, showToast }) {
      const [selectedFilter, setSelectedFilter] = useState('All');
      const [holdingItem, setHoldingItem] = useState(null);
      const [reserveName, setReserveName] = useState('');
      const [reservePhone, setReservePhone] = useState('');

      const filteredItems = useMemo(() => {
        if (selectedFilter === 'All') return accessories;
        return accessories.filter(a => a.compatibility.includes(selectedFilter) || a.category === selectedFilter);
      }, [accessories, selectedFilter]);

      const handleReserveSubmit = (e) => {
        e.preventDefault();
        if (!reserveName || !reservePhone) {
          showToast('Please enter your name and phone number', 'error');
          return;
        }

        const newHold = {
          id: 'HLD-' + Math.floor(100 + Math.random() * 900),
          name: reserveName,
          phone: reservePhone,
          item: holdingItem.name,
          qty: 1,
          status: 'Active (Behind Counter)',
          expires: '24 Hours Left'
        };

        setHolds(prev => [newHold, ...prev]);
        showToast(`Item Reserved! Held for 24 hrs under name "${reserveName}".`);
        setHoldingItem(null);
        setReserveName('');
        setReservePhone('');
      };

      return (
        <div className="space-y-8">
          <div className="max-w-2xl">
            <h1 className="text-3xl font-semibold text-charcoal">In-Stock Store Accessories</h1>
            <p className="text-charcoal-muted text-sm mt-1">Real-time local inventory. Reserve items online for free 24-hour hold behind our counter.</p>

          <div className="flex items-center space-x-2 overflow-x-auto pb-2 custom-scrollbar">
            {['All', 'iPhone 15', 'iPhone 15 Pro', 'iPhone 14', 'Chargers', 'Cases'].map((filter) => (
              <button
                key={filter}
                onClick={() => setSelectedFilter(filter)}
                className={`px-4 py-2 rounded-full text-xs font-semibold whitespace-nowrap transition ${
                  selectedFilter === filter 
                    ? 'bg-charcoal text-white shadow-apple-sm' 
                    : 'bg-card text-charcoal-muted border border-cream-200 hover:bg-cream-100'
                }`}
              >
                {filter}
              </button>
            ))}
          </div>

          {/* Product Cards Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            {filteredItems.map((item) => (
              <div 
                key={item.id}
                className="bg-card rounded-3xl p-6 border border-cream-200/80 shadow-apple-sm hover:shadow-apple-hover transition-all duration-300 flex flex-col justify-between"
              >
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-[10px] uppercase font-bold tracking-wider text-charcoal-light bg-cream-100 px-2.5 py-1 rounded-full">
                      {item.category}
                    </span>
                    <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-full ${
                      item.stock <= 3 ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'
                    }`}>
                      {item.stock} left in store
                    </span>
                  </div>

                  <h3 className="text-base font-semibold text-charcoal">{item.name}</h3>
                  
                  {/* Compatibility Tags */}
                  <div className="flex flex-wrap gap-1 mt-3">
                    {item.compatibility.map((comp) => (
                      <span key={comp} className="text-[10px] text-charcoal-muted bg-cream-50 px-2 py-0.5 rounded border border-cream-200">
                        {comp}
                      </span>
                    ))}
                  </div>
                </div>

                <div className="mt-6 pt-4 border-t border-cream-100 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-charcoal-light">Price</span>
                    <div className="text-lg font-bold text-charcoal">${item.price.toFixed(2)}</div>
                  </div>

                  <button 
                    onClick={() => setHoldingItem(item)}
                    className="bg-cream-100 text-charcoal hover:bg-terracotta hover:text-white px-4 py-2 rounded-full text-xs font-semibold transition border border-cream-200"
                  >
                    Reserve for Pickup
                  </button>
                </div>
              </div>
            ))}
          </div>

          {/* Reserve 24-Hour Hold Modal */}
          {holdingItem && (

                <div className="flex justify-between items-start">

                    <span className="text-[10px] font-bold uppercase tracking-wider text-terracotta bg-terracotta-light px-2.5 py-1 rounded-full">

                    <h3 className="text-xl font-bold text-charcoal mt-2">{holdingItem.name}</h3>
                  </div>
                  <button onClick={() => setHoldingItem(null)} className="text-charcoal-light hover:text-charcoal">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="p-3 bg-cream-50 rounded-2xl border border-cream-200 text-xs text-charcoal-muted flex justify-between">
                  <span>Unit Price: <strong className="text-charcoal">${holdingItem.price.toFixed(2)}</strong></span>
                  <span>In Stock: <strong className="text-emerald-700">{holdingItem.stock} available</strong></span>

                  <div className="flex space-x-3 pt-2">

                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="w-1/2 bg-charcoal text-white font-medium py-2.5 rounded-full text-xs hover:bg-charcoal/90 transition shadow"
                    >
                      Confirm Hold
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

                        </td>
                        <td className="p-3 space-x-1">
                          <span className="bg-cream-100 px-2 py-0.5 rounded text-[10px]">{p.pages} pgs</span>
                          <span className="bg-cream-100 px-2 py-0.5 rounded text-[10px]">{p.color}</span>
                          <span className="bg-cream-100 px-2 py-0.5 rounded text-[10px]">{p.layout}</span>
                        </td>
                        <td className="p-3 font-bold text-charcoal">{p.total}</td>
                        <td className="p-3">
                          <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                            p.status === 'Completed' ? 'bg-emerald-100 text-emerald-800' :
                            p.status === 'Printing' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'
                          }`}>
                            {p.status}
                          </span>
                        </td>
                        <td className="p-3 text-right space-x-2">
                          <button 
                            onClick={() => updatePrintStatus(p.id, 'Printing')}
                            className="bg-cream-200 text-charcoal hover:bg-cream-300 px-3 py-1 rounded-lg text-[11px] font-semibold"
                          >
                            Send to Printer
                          </button>
                          <button 
                            onClick={() => updatePrintStatus(p.id, 'Completed')}
                            className="bg-emerald-600 text-white hover:bg-emerald-700 px-3 py-1 rounded-lg text-[11px] font-semibold"
                          >
                            Mark Completed
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* SUB-VIEW 2: REPAIR WORKFLOW MANAGER */}
          {activeSubTab === 'repairs' && (
            <div className="bg-card rounded-3xl p-6 border border-cream-200 shadow-apple space-y-4">
              <h2 className="text-base font-semibold text-charcoal">Active Repair Work Orders</h2>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {repairs.map((r) => (
                  <div key={r.id} className="p-4 bg-cream-50 rounded-2xl border border-cream-200 space-y-3">
                    <div className="flex justify-between items-start">
                      <div>
                        <span className="text-[10px] font-bold text-terracotta">{r.id}</span>
                        <h4 className="font-semibold text-sm text-charcoal">{r.device}</h4>
                      </div>
                      <span className="text-[10px] bg-cream-200 px-2 py-0.5 rounded font-bold">{r.code}</span>
                    </div>

                    <div className="text-xs text-charcoal-muted space-y-1">
                      <div>Customer: <strong className="text-charcoal">{r.name}</strong> ({r.phone})</div>
                      <div>Issue: <strong className="text-charcoal">{r.issue}</strong></div>
                      <div>Slot: <strong className="text-charcoal">{r.time}</strong></div>
                    </div>

                    <div className="pt-2 border-t border-cream-200">
                      <label className="block text-[10px] uppercase font-bold text-charcoal-light mb-1">Update Repair Status</label>
                      <select 
                        value={r.status}
                        onChange={(e) => updateRepairStatus(r.id, e.target.value)}
                        className="w-full bg-white border border-cream-200 rounded-xl px-2.5 py-1.5 text-xs font-semibold focus:ring-2 focus:ring-terracotta focus:outline-none"
                      >
                        <option value="Received">Received</option>
                        <option value="In Repair">In Repair</option>
                        <option value="Ready for Pickup">Ready for Pickup (Auto SMS)</option>
                        <option value="Completed">Completed & Handed Over</option>
                      </select>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* SUB-VIEW 3: RESERVE HOLDS TAGGER */}
          {activeSubTab === 'holds' && (
            <div className="bg-card rounded-3xl p-6 border border-cream-200 shadow-apple space-y-4">
              <h2 className="text-base font-semibold text-charcoal">Active Counter Hold Reserve Tags</h2>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {holds.map((h) => (
                  <div key={h.id} className="p-4 bg-cream-50 rounded-2xl border border-cream-200 space-y-2 flex justify-between items-center">
                    <div>
                      <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full">{h.expires}</span>
                      <h4 className="font-bold text-sm text-charcoal mt-1">{h.item}</h4>
                      <p className="text-xs text-charcoal-muted">Hold Name: <strong className="text-charcoal">{h.name}</strong> ({h.phone})</p>
                    </div>
                    <button 
                      onClick={() => {
                        setHolds(holds.filter(item => item.id !== h.id));
                        showToast(`Hold ${h.id} completed / item handed to customer.`);
                      }}
                      className="bg-charcoal text-white hover:bg-charcoal/80 text-xs px-3 py-1.5 rounded-xl font-medium"
                    >
                      Complete Pickup
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
